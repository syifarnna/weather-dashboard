<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Cuaca Indonesia</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif; }
  body { background:var(--bg); color:var(--text); padding:24px; max-width:1100px; margin:0 auto; }
  h1 { font-size:1.7rem; margin-bottom:4px; }
  .caption { color:var(--muted); font-size:.9rem; margin-bottom:20px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .chip { background:var(--card); border:1px solid #334155; color:var(--text);
          padding:7px 16px; border-radius:999px; cursor:pointer; font-size:.9rem; transition:.15s; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#0f172a; font-weight:600; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:28px; }
  .card { background:var(--card); border-radius:14px; padding:16px; }
  .card .kota { color:var(--muted); font-size:.85rem; }
  .card .suhu { font-size:2rem; font-weight:700; }
  .card .min { color:var(--muted); font-size:.85rem; }
  .section { font-size:1.15rem; margin:18px 0 10px; }
  .chart { background:var(--card); border-radius:14px; padding:8px; }
  #status { color:var(--muted); padding:40px 0; text-align:center; }
</style>
</head>
<body>
<h1>🌤️ Dashboard Cuaca Indonesia</h1>
<p class="caption">Prakiraan 7 hari — data Open-Meteo API (gratis, tanpa API key)</p>
<div class="chips" id="chips"></div>
<div class="cards" id="cards"></div>
<div id="status">Memuat data…</div>
<div><div class="section">Suhu 7 hari ke depan</div><div class="chart" id="suhu"></div></div>
<div><div class="section">Peluang hujan maksimal (%)</div><div class="chart" id="hujan"></div></div>

<script>
const KOTA = {
  "Jakarta":[ -6.2,106.8], "Bandung":[-6.9,107.6], "Surabaya":[-7.25,112.75],
  "Yogyakarta":[-7.8,110.4], "Medan":[3.6,98.67], "Makassar":[-5.15,119.43],
  "Denpasar":[-8.65,115.22],
};
const pilih = new Set(["Jakarta","Bandung","Surabaya"]);
const cache = {};

async function ambil(kota) {
  if (cache[kota]) return cache[kota];
  const [lat,lon] = KOTA[kota];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&timezone=Asia%2FJakarta&forecast_days=7`;
  const d = (await (await fetch(url)).json()).daily;
  const df = { tgl:d.time.map(s=>new Date(s+"T00:00:00")),
               tmax:d.temperature_2m_max, tmin:d.temperature_2m_min, hujan:d.precipitation_probability_max };
  cache[kota] = df; return df;
}

function layout(yTitle) {
  return { paper_bgcolor:"rgba(0,0,0,0)", plot_bgcolor:"rgba(0,0,0,0)",
    font:{color:"#e2e8f0"}, margin:{l:50,r:20,t:10,b:40}, height:340,
    xaxis:{gridcolor:"#334155"}, yaxis:{title:yTitle, gridcolor:"#334155"},
    legend:{orientation:"h", y:-0.25} };
}

async function render() {
  document.getElementById("cards").innerHTML = "";
  if (!pilih.size) { document.getElementById("status").textContent = "Pilih minimal satu kota 👆"; return; }
  document.getElementById("status").textContent = "";
  const today = new Date(); today.setHours(0,0,0,0);
  const data = {};
  for (const k of pilih) data[k] = await ambil(k);

  // kartu ringkasan
  const hariIni = Object.keys(data).map(k => {
    const i = data[k].tgl.findIndex(t => +t === +today);
    const idx = i >= 0 ? i : 0;
    return {k, idx};
  });
  document.getElementById("cards").innerHTML = hariIni.map(({k,idx}) => {
    const d = data[k];
    const em = d.hujan[idx] >= 60 ? "🌧️" : d.hujan[idx] >= 30 ? "⛅" : "☀️";
    return `<div class="card"><div class="kota">${em} ${k}</div>
      <div class="suhu">${Math.round(d.tmax[idx])}°C</div>
      <div class="min">min ${Math.round(d.tmin[idx])}°C · hujan ${d.hujan[idx]}%</div></div>`;
  }).join("");

  // grafik suhu
  const fig1 = { data:[], layout:layout("°C") };
  for (const k of pilih) {
    const d = data[k];
    fig1.data.push({x:d.tgl, y:d.tmax, name:`${k} (max)`, mode:"lines+markers"});
    fig1.data.push({x:d.tgl, y:d.tmin, name:`${k} (min)`, mode:"lines", line:{dash:"dot"}});
  }
  Plotly.newPlot("suhu", fig1);

  // grafik hujan
  const fig2 = { data:[], layout:layout("%") };
  fig2.layout.barmode = "group";
  fig2.layout.yaxis.range = [0,100];
  for (const k of pilih) fig2.data.push({x:data[k].tgl, y:data[k].hujan, name:k, type:"bar"});
  Plotly.newPlot("hujan", fig2);
}

// chips
const chipsEl = document.getElementById("chips");
for (const k of Object.keys(KOTA)) {
  const b = document.createElement("button");
  b.className = "chip" + (pilih.has(k) ? " on" : "");
  b.textContent = k;
  b.onclick = () => { pilih.has(k) ? (pilih.size > 1 && pilih.delete(k)) : pilih.add(k);
                      b.classList.toggle("on"); render(); };
  chipsEl.appendChild(b);
}
render();
</script>
</body>
</html>
